name: Build Freeczx Music APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # PASSO NOVO: Forçar limpeza e verificação
      - name: Debug & Fix Project Root
        run: |
          echo "=== Listando arquivos ==="
          ls -la
          echo "=== Verificando pubspec.yaml ==="
          if [ -f pubspec.yaml ]; then
            echo "ARQUIVO ENCONTRADO!"
            head -n 10 pubspec.yaml
          else
            echo "ARQUIVO NÃO ENCONTRADO! Criando projeto novo..."
            # Se não achar, cria um projeto Flutter básico para testar
            flutter create --project-name sonem_music_temp . --force
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
